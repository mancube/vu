# vu configuration — every key is optional; these are the defaults.
# theme: default|warm|mono|neon
theme = default
bar_length = 40
db_min = -60
db_max = 0
# ballistics: bar falls 20 dB per 1/60 s ≈ 0.3 s; peak marker clears in ~1.7 s
release_dbps = 60
hold_decay_dbps = 30
rms_window = 0.01
# color overrides: a color name, 0-255, or `default` (terminal default color).
# Any override switches the theme to "custom".
# color_normal, color_hot, color_peak, color_scale, color_text
